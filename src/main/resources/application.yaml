spring:
  application:
    name: spring-ai
  mongodb:
    uri: mongodb://localhost:27017/spring-ai
  ai:
    chat:
      memory:
        repository:
          mongo:
            create-indices: true
    openai:
      api-key: Place your Open API Key here
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
      audio:
        transcription:
          model: whisper-1
          response-format: text
          language: en
          temperature: 0
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: spring_ai_documents
        use-tls: false
        initialize-schema: true
    mcp:
      server:
        enabled: true
        name: product-catalog
        version: 1.0.0
        type: SYNC
      client:
        enabled: true
        type: SYNC
        annotation-scanner:
          enabled: false
        stdio:
          connections:
            drawio:
              command: npx
              args:
                - "-y"
                - "@drawio/mcp"

app:
  ai:
    retrieval:
      top-k: 4
      similarity-threshold: 0.5
    safeguard:
      sensitive-words:
        - abusive
        - vulgar
        - violence
        - hate
        - attack
        - kill
        - bomb
        - terror
        - illegal
        - weapon
      failure-response: "I cannot fulfill this request because it contains prohibited or sensitive content."

logging:
  level:
    root: INFO
    org.springframework.ai.chat.client.advisor: DEBUG
    com.learning: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true